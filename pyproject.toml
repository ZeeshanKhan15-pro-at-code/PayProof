[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payproof"
version = "0.1.0"
description = "Phase-1 skeleton for human-reviewed payment destination comparison"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.5", "Flask==3.1.3", "gunicorn==26.2.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==2.4.0", "build==1.6.1"]

[project.scripts]
payproof = "payproof.cli:main"

[tool.setuptools.packages.find]
include = ["payproof*"]

[tool.setuptools.package-data]
payproof = ["py.typed", "fixtures/trusted_vendors/*.json", "fixtures/requests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["payproof"]
strict = true
plugins = ["pydantic.mypy"]
